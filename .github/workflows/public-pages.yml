name: Publish public documents

on:
  push:
    branches: [master, fix/sufficiency-voting]
    paths:
      - public-site/**
      - runner/build-public-pages.ts
      - tests/public-pages.test.ts
      - package.json
      - package-lock.json
      - .github/workflows/public-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/public-pages.test.ts
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .cache/public-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved documents
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
